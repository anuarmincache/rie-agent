<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540">
  <rect width="1080" height="540" rx="18" fill="#101a33"/>
  <text x="48" y="50" fill="#ffffff" font-size="28" font-family="Arial, sans-serif" font-weight="bold">R3c model across the Nd series</text>
  <text x="48" y="82" fill="#a6d7ed" font-size="16" font-family="Arial, sans-serif">Frozen instrument. Array Rwp of the adopted R3c fit. Open marker: best orthorhombic trial at 15%, not adopted.</text>

  <line x1="110" y1="110" x2="110" y2="400" stroke="#35557a" stroke-width="1.5"/>
  <line x1="110" y1="400" x2="1020" y2="400" stroke="#35557a" stroke-width="1.5"/>

  <!-- y grid 10, 15, 20. ymin=8 ymax=24 plot 110..400 height 290 -->
  <!-- y(v) = 400 - (v-8)/16*290 -->
  <g stroke="#24385c" stroke-width="1">
    <line x1="110" y1="363.8" x2="1020" y2="363.8"/>
    <line x1="110" y1="273.1" x2="1020" y2="273.1"/>
    <line x1="110" y1="182.5" x2="1020" y2="182.5"/>
  </g>
  <g fill="#8fb4cc" font-size="14" font-family="Arial, sans-serif" text-anchor="end">
    <text x="98" y="368">10</text>
    <text x="98" y="277">15</text>
    <text x="98" y="187">20</text>
  </g>
  <text x="32" y="270" fill="#8fb4cc" font-size="14" font-family="Arial, sans-serif" transform="rotate(-90 32 270)">Rwp</text>

  <!-- x(t) = 150 + (t-2.5)/17.5*820 -->
  <g fill="#8fb4cc" font-size="14" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="150" y="426">2.5%</text>
    <text x="267" y="426">5%</text>
    <text x="501" y="426">10%</text>
    <text x="736" y="426">15%</text>
    <text x="970" y="426">20%</text>
  </g>
  <text x="560" y="456" fill="#8fb4cc" font-size="14" font-family="Arial, sans-serif" text-anchor="middle">nominal Nd fraction</text>

  <!-- R3c line -->
  <polyline fill="none" stroke="#78e0ec" stroke-width="3"
            points="150,366.5 267,361.4 501,347.3 736,316.5 970,152.8"/>

  <!-- OK points -->
  <g fill="#3ecfb2" stroke="#101a33" stroke-width="2">
    <circle cx="150" cy="366.5" r="8"/>
    <circle cx="267" cy="361.4" r="8"/>
    <circle cx="501" cy="347.3" r="8"/>
  </g>
  <!-- FAIL points -->
  <g stroke="#101a33" stroke-width="2">
    <circle cx="736" cy="316.5" r="8" fill="#f2c14e"/>
    <circle cx="970" cy="152.8" r="8" fill="#e06a5c"/>
  </g>
  <!-- orthorhombic trial at 15%, Rwp 17.0. y = 400 - 9/16*290 = 236.9 -->
  <circle cx="736" cy="236.9" r="8" fill="none" stroke="#d7e6f2" stroke-width="2.5"/>

  <g fill="#e0eaf2" font-size="15" font-family="Arial, sans-serif" font-weight="bold">
    <text x="150" y="350" text-anchor="middle">9.85</text>
    <text x="267" y="345" text-anchor="middle">10.13</text>
    <text x="501" y="331" text-anchor="middle">10.91</text>
    <text x="736" y="300" text-anchor="middle">12.61</text>
    <text x="970" y="136" text-anchor="middle">21.64</text>
  </g>
  <text x="820" y="232" fill="#d7e6f2" font-size="14" font-family="Arial, sans-serif">Pnma 16.97 · Pbam 16.95</text>

  <g font-size="14" font-family="Arial, sans-serif">
    <circle cx="150" cy="492" r="6" fill="#3ecfb2"/>
    <text x="166" y="497" fill="#e0eaf2">VERDICT OK</text>
    <circle cx="310" cy="492" r="6" fill="#f2c14e"/>
    <text x="326" y="497" fill="#e0eaf2">R3c kept, Uiso fails</text>
    <circle cx="530" cy="492" r="6" fill="#e06a5c"/>
    <text x="546" y="497" fill="#e0eaf2">R3c breaks</text>
    <circle cx="700" cy="492" r="6" fill="none" stroke="#d7e6f2" stroke-width="2"/>
    <text x="716" y="497" fill="#e0eaf2">not adopted</text>
  </g>
</svg>
